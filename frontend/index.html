<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student API Manager</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0f14;
        --surface: #161921;
        --surface2: #1e2230;
        --border: #2a2f3f;
        --accent: #7fffd4;
        --accent2: #ff6b6b;
        --accent3: #ffd166;
        --text: #e8ecf4;
        --muted: #6b7494;
        --success: #06d6a0;
        --error: #ef233c;
        --radius: 10px;
        --mono: "DM Mono", monospace;
        --serif: "Fraunces", serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--mono);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px 1fr;
        grid-template-rows: auto 1fr;
      }

      /* ── Header ── */
      header {
        grid-column: 1 / -1;
        padding: 20px 32px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 20px;
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      header .logo {
        font-family: var(--serif);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
      }
      header .logo span {
        color: var(--muted);
        font-weight: 300;
        font-style: italic;
      }
      .base-url {
        margin-left: auto;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .base-url label {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .base-url input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.88rem;
        width: 220px;
      }

      /* ── Sidebar ── */
      aside {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 24px 16px;
        overflow-y: auto;
      }
      .sidebar-title {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--muted);
        padding: 0 8px;
        margin-bottom: 12px;
      }
      .nav-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 10px 12px;
        border-radius: var(--radius);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.82rem;
        text-align: left;
        transition: all 0.18s;
        margin-bottom: 4px;
      }
      .nav-btn:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .nav-btn.active {
        background: var(--surface2);
        color: var(--text);
        border-left: 2px solid var(--accent);
      }
      .method-badge {
        font-size: 0.68rem;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 4px;
        min-width: 48px;
        text-align: center;
      }
      .POST {
        background: #0d3b2e;
        color: var(--success);
      }
      .GET {
        background: #0d1f3b;
        color: #60a5fa;
      }
      .PUT {
        background: #2e2200;
        color: var(--accent3);
      }
      .DELETE {
        background: #2e0d0d;
        color: var(--accent2);
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 16px 0;
      }

      /* ── Main Panel ── */
      main {
        padding: 32px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        animation: fadeUp 0.3s ease both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .panel-header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .panel-title {
        font-family: var(--serif);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
      }
      .endpoint-tag {
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--surface2);
        padding: 4px 10px;
        border-radius: 5px;
      }
      .panel-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ── Form Fields ── */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
      }
      .field input,
      .field textarea {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 0.88rem;
        outline: none;
        transition: border-color 0.18s;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: var(--accent);
      }
      .field input::placeholder {
        color: var(--muted);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      /* ── Buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 22px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.18s;
      }
      .btn-primary {
        background: var(--accent);
        color: #0d1a14;
      }
      .btn-primary:hover {
        background: #5fffbe;
      }
      .btn-danger {
        background: var(--accent2);
        color: #fff;
      }
      .btn-danger:hover {
        background: #ff4444;
      }
      .btn-warn {
        background: var(--accent3);
        color: #1a1000;
      }
      .btn-warn:hover {
        background: #ffe066;
      }
      .btn-blue {
        background: #3b82f6;
        color: #fff;
      }
      .btn-blue:hover {
        background: #60a5fa;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ── Response Box ── */
      .response-box {
        background: #0a0c10;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .response-header {
        padding: 10px 16px;
        background: var(--surface2);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
      }
      .status-pill {
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.78rem;
        font-weight: 500;
      }
      .status-ok {
        background: #0d3b2e;
        color: var(--success);
      }
      .status-err {
        background: #2e0d0d;
        color: var(--accent2);
      }
      .response-body {
        padding: 16px;
        font-size: 0.82rem;
        line-height: 1.7;
        color: var(--accent);
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 280px;
        overflow-y: auto;
        min-height: 60px;
      }

      /* ── Student Table ── */
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.83rem;
      }
      th {
        text-align: left;
        padding: 10px 14px;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: var(--surface2);
      }
      .action-btns {
        display: flex;
        gap: 8px;
      }
      .icon-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 0.78rem;
        font-family: var(--mono);
        transition: all 0.15s;
      }
      .icon-btn.edit {
        color: var(--accent3);
        border-color: #2e2200;
      }
      .icon-btn.edit:hover {
        background: #2e2200;
      }
      .icon-btn.del {
        color: var(--accent2);
        border-color: #2e0d0d;
      }
      .icon-btn.del:hover {
        background: #2e0d0d;
      }
      .empty-state {
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }

      /* ── Toast ── */
      #toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 20px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 10px;
        transform: translateY(80px);
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 999;
      }
      #toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      #toast .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      #toast.success .dot {
        background: var(--success);
      }
      #toast.error .dot {
        background: var(--accent2);
      }

      .loading {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      section[data-section] {
        display: none;
      }
      section[data-section].active {
        display: contents;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Student <span>API</span></div>
      <div class="base-url">
        <label>Base URL</label>
        <input
          type="text"
          id="baseUrl"
          value="http://localhost:8080"
          placeholder="http://localhost:8080"
        />
      </div>
    </header>

    <aside>
      <div class="sidebar-title">Endpoints</div>

      <button
        class="nav-btn active"
        data-section="list"
        onclick="switchSection('list', this)"
      >
        <span class="method-badge GET">GET</span> All Students
      </button>
      <button
        class="nav-btn"
        data-section="create"
        onclick="switchSection('create', this)"
      >
        <span class="method-badge POST">POST</span> Create Student
      </button>

      <div class="divider"></div>

      <button
        class="nav-btn"
        data-section="getone"
        onclick="switchSection('getone', this)"
      >
        <span class="method-badge GET">GET</span> Student by ID
      </button>
      <button
        class="nav-btn"
        data-section="update"
        onclick="switchSection('update', this)"
      >
        <span class="method-badge PUT">PUT</span> Update Student
      </button>
      <button
        class="nav-btn"
        data-section="delete"
        onclick="switchSection('delete', this)"
      >
        <span class="method-badge DELETE">DEL</span> Delete Student
      </button>
    </aside>

    <main>
      <!-- GET ALL -->
      <section data-section="list" class="active">
        <div class="panel">
          <div class="panel-header">
            <span class="method-badge GET">GET</span>
            <span class="panel-title">All Students</span>
            <span class="endpoint-tag">/students</span>
            <button
              class="btn btn-blue"
              style="margin-left: auto"
              onclick="getAllStudents()"
            >
              <span id="list-spinner"></span> Fetch Students
            </button>
          </div>
          <div class="panel-body">
            <div class="table-wrap" id="student-table">
              <div class="empty-state">Press "Fetch Students" to load data</div>
            </div>
            <div class="response-box" id="list-response" style="display: none">
              <div class="response-header">
                Response <span class="status-pill" id="list-status"></span>
              </div>
              <div class="response-body" id="list-body"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- POST -->
      <section data-section="create">
        <div class="panel">
          <div class="panel-header">
            <span class="method-badge POST">POST</span>
            <span class="panel-title">Create Student</span>
            <span class="endpoint-tag">/students</span>
          </div>
          <div class="panel-body">
            <div class="row">
              <div class="field">
                <label>First Name</label
                ><input id="c-fname" placeholder="John" />
              </div>
              <div class="field">
                <label>Last Name</label><input id="c-lname" placeholder="Doe" />
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label>Email</label
                ><input id="c-email" placeholder="john@example.com" />
              </div>
              <div class="field">
                <label>Age</label
                ><input id="c-age" type="number" placeholder="21" />
              </div>
            </div>
            <div class="field">
              <label>Course / Major</label
              ><input id="c-course" placeholder="Computer Science" />
            </div>
            <button class="btn btn-primary" onclick="createStudent()">
              <span id="create-spinner"></span> Create Student
            </button>
            <div
              class="response-box"
              id="create-response"
              style="display: none"
            >
              <div class="response-header">
                Response <span class="status-pill" id="create-status"></span>
              </div>
              <div class="response-body" id="create-body"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- GET ONE -->
      <section data-section="getone">
        <div class="panel">
          <div class="panel-header">
            <span class="method-badge GET">GET</span>
            <span class="panel-title">Get Student by ID</span>
            <span class="endpoint-tag">/students/{id}</span>
          </div>
          <div class="panel-body">
            <div class="field" style="max-width: 240px">
              <label>Student ID</label>
              <input id="g-id" placeholder="e.g. 1" />
            </div>
            <button class="btn btn-blue" onclick="getStudent()">
              <span id="get-spinner"></span> Fetch Student
            </button>
            <div class="response-box" id="get-response" style="display: none">
              <div class="response-header">
                Response <span class="status-pill" id="get-status"></span>
              </div>
              <div class="response-body" id="get-body"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- PUT -->
      <section data-section="update">
        <div class="panel">
          <div class="panel-header">
            <span class="method-badge PUT">PUT</span>
            <span class="panel-title">Update Student</span>
            <span class="endpoint-tag">/students/{id}</span>
          </div>
          <div class="panel-body">
            <div class="field" style="max-width: 240px">
              <label>Student ID</label>
              <input id="u-id" placeholder="e.g. 1" />
            </div>
            <div class="row">
              <div class="field">
                <label>First Name</label
                ><input id="u-fname" placeholder="Jane" />
              </div>
              <div class="field">
                <label>Last Name</label><input id="u-lname" placeholder="Doe" />
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label>Email</label
                ><input id="u-email" placeholder="jane@example.com" />
              </div>
              <div class="field">
                <label>Age</label
                ><input id="u-age" type="number" placeholder="22" />
              </div>
            </div>
            <div class="field">
              <label>Course / Major</label
              ><input id="u-course" placeholder="Physics" />
            </div>
            <button class="btn btn-warn" onclick="updateStudent()">
              <span id="update-spinner"></span> Update Student
            </button>
            <div
              class="response-box"
              id="update-response"
              style="display: none"
            >
              <div class="response-header">
                Response <span class="status-pill" id="update-status"></span>
              </div>
              <div class="response-body" id="update-body"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- DELETE -->
      <section data-section="delete">
        <div class="panel">
          <div class="panel-header">
            <span class="method-badge DELETE">DELETE</span>
            <span class="panel-title">Delete Student</span>
            <span class="endpoint-tag">/students/{id}</span>
          </div>
          <div class="panel-body">
            <div class="field" style="max-width: 240px">
              <label>Student ID</label>
              <input id="d-id" placeholder="e.g. 1" />
            </div>
            <button class="btn btn-danger" onclick="deleteStudent()">
              <span id="delete-spinner"></span> Delete Student
            </button>
            <div
              class="response-box"
              id="delete-response"
              style="display: none"
            >
              <div class="response-header">
                Response <span class="status-pill" id="delete-status"></span>
              </div>
              <div class="response-body" id="delete-body"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Toast -->
    <div id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const base = () => $("baseUrl").value.replace(/\/$/, "");

      /* ── Section switcher ── */
      function switchSection(name, btn) {
        document
          .querySelectorAll("section[data-section]")
          .forEach((s) => s.classList.remove("active"));
        document
          .querySelector(`section[data-section="${name}"]`)
          .classList.add("active");
        document
          .querySelectorAll(".nav-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      }

      /* ── Toast ── */
      function showToast(msg, type = "success") {
        const t = $("toast");
        $("toast-msg").textContent = msg;
        t.className = `show ${type}`;
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("show"), 3000);
      }

      /* ── Spinner helpers ── */
      function spin(id, on) {
        $(id).innerHTML = on ? '<span class="loading"></span>' : "";
      }

      /* ── Response renderer ── */
      function showResponse(prefix, status, data) {
        const box = $(`${prefix}-response`);
        const statusEl = $(`${prefix}-status`);
        const bodyEl = $(`${prefix}-body`);
        box.style.display = "block";
        const ok = status >= 200 && status < 300;
        statusEl.textContent = status;
        statusEl.className = `status-pill ${ok ? "status-ok" : "status-err"}`;
        bodyEl.textContent =
          typeof data === "string" ? data : JSON.stringify(data, null, 2);
      }

      /* ── API call ── */
      async function api(method, path, body) {
        const opts = {
          method,
          headers: { "Content-Type": "application/json" },
        };
        if (body) opts.body = JSON.stringify(body);
        try {
          const res = await fetch(`${base()}${path}`, opts);
          let data;
          try {
            data = await res.json();
          } catch {
            data = await res.text();
          }
          return { status: res.status, data };
        } catch (e) {
          return { status: 0, data: `Network error: ${e.message}` };
        }
      }

      /* ── Build students table ── */
      function buildTable(students) {
        if (!students || !students.length) {
          $("student-table").innerHTML =
            '<div class="empty-state">No students found</div>';
          return;
        }
        const cols = Object.keys(students[0]);
        $("student-table").innerHTML = `
      <table>
        <thead><tr>
          ${cols.map((c) => `<th>${c}</th>`).join("")}
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${students
            .map(
              (s) => `<tr>
            ${cols.map((c) => `<td>${s[c] ?? "—"}</td>`).join("")}
            <td><div class="action-btns">
              <button class="icon-btn edit" onclick="prefillUpdate(${JSON.stringify(s).replace(/"/g, "&quot;")})">Edit</button>
              <button class="icon-btn del"  onclick="prefillDelete(${s.id ?? s.Id ?? s.studentId ?? ""})">Delete</button>
            </div></td>
          </tr>`,
            )
            .join("")}
        </tbody>
      </table>`;
      }

      /* ── CRUD ── */
      async function getAllStudents() {
        spin("list-spinner", true);
        const { status, data } = await api("GET", "/students");
        spin("list-spinner", false);
        showResponse("list", status, data);
        if (status === 200 && Array.isArray(data)) buildTable(data);
        else
          $("student-table").innerHTML =
            '<div class="empty-state">Could not parse student list</div>';
        showToast(
          status === 200 ? "Students loaded" : "Error fetching students",
          status === 200 ? "success" : "error",
        );
      }

      async function createStudent() {
        const body = {
          firstName: $("c-fname").value,
          lastName: $("c-lname").value,
          email: $("c-email").value,
          age: Number($("c-age").value),
          course: $("c-course").value,
        };
        spin("create-spinner", true);
        const { status, data } = await api("POST", "/students", body);
        spin("create-spinner", false);
        showResponse("create", status, data);
        showToast(
          status === 201 ? "Student created!" : "Failed to create",
          status === 201 ? "success" : "error",
        );
      }

      async function getStudent() {
        const id = $("g-id").value.trim();
        if (!id) {
          showToast("Enter a student ID", "error");
          return;
        }
        spin("get-spinner", true);
        const { status, data } = await api("GET", `/students/${id}`);
        spin("get-spinner", false);
        showResponse("get", status, data);
        showToast(
          status === 200 ? `Student ${id} fetched` : "Not found",
          status === 200 ? "success" : "error",
        );
      }

      async function updateStudent() {
        const id = $("u-id").value.trim();
        if (!id) {
          showToast("Enter a student ID", "error");
          return;
        }
        const body = {
          firstName: $("u-fname").value,
          lastName: $("u-lname").value,
          email: $("u-email").value,
          age: Number($("u-age").value),
          course: $("u-course").value,
        };
        spin("update-spinner", true);
        const { status, data } = await api("PUT", `/students/${id}`, body);
        spin("update-spinner", false);
        showResponse("update", status, data);
        showToast(
          status === 200 ? "Student updated!" : "Update failed",
          status === 200 ? "success" : "error",
        );
      }

      async function deleteStudent() {
        const id = $("d-id").value.trim();
        if (!id) {
          showToast("Enter a student ID", "error");
          return;
        }
        spin("delete-spinner", true);
        const { status, data } = await api("DELETE", `/students/${id}`);
        spin("delete-spinner", false);
        showResponse("delete", status, data);
        showToast(
          status === 200 ? `Student ${id} deleted` : "Delete failed",
          status === 200 ? "success" : "error",
        );
      }

      /* ── Quick-fill helpers from table ── */
      function prefillUpdate(s) {
        const idKey = Object.keys(s).find((k) =>
          k.toLowerCase().includes("id"),
        );
        $("u-id").value = s[idKey] ?? "";
        $("u-fname").value = s.firstName ?? s.first_name ?? "";
        $("u-lname").value = s.lastName ?? s.last_name ?? "";
        $("u-email").value = s.email ?? "";
        $("u-age").value = s.age ?? "";
        $("u-course").value = s.course ?? s.major ?? "";
        switchSection(
          "update",
          document.querySelector('.nav-btn[data-section="update"]'),
        );
        showToast("Student pre-filled for editing");
      }

      function prefillDelete(id) {
        $("d-id").value = id;
        switchSection(
          "delete",
          document.querySelector('.nav-btn[data-section="delete"]'),
        );
        showToast("Ready to delete — confirm below", "error");
      }
    </script>
  </body>
</html>
